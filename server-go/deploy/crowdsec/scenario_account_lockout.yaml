type: leaky
name: custom/eraonline-account-lockout
description: "Era Online: account lockout triggered (too many failed logins)"
filter: "evt.Meta.log_type == 'account_lockout'"
groupby: evt.Meta.source_ip
capacity: 2
leakspeed: "5m"
blackhole: 1h
labels:
  service: eraonline
  type: bruteforce
  remediation: true
